services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-note}
      POSTGRES_USER: ${DB_USER:-note}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
  server:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-note}
      DB_USER: ${DB_USER:-note}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MEDIA_ROOT: /app/data/media
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - media_data:/app/data/media
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
  media_data:
